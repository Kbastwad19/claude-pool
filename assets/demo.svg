<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
    }
    .f-11 { font-size: 11px; }
    .f-12 { font-size: 12px; }
    .f-13 { font-size: 13px; }
    .bold { font-weight: 600; }
    
    .c-zinc { fill: #e4e4e7; }
    .c-muted { fill: #a1a1aa; }
    .c-dim { fill: #71717a; }
    .c-accent { fill: #a5b4fc; }
    .c-mint { fill: #6ee7b7; }
    .c-ochre { fill: #fde047; }
    .c-cyan { fill: #7dd3fc; }

    /* Scene 1 Animations (0s - 6s) */
    @keyframes scene1_fade {
      0%, 45% { opacity: 1; }
      48%, 97% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes s1_step_hud {
      0%, 6% { opacity: 0; }
      10%, 45% { opacity: 1; }
      48%, 100% { opacity: 0; }
    }

    @keyframes s1_step_query {
      0%, 18% { opacity: 0; }
      22%, 45% { opacity: 1; }
      48%, 100% { opacity: 0; }
    }

    @keyframes s1_step_limit {
      0%, 32% { opacity: 0; }
      36%, 45% { opacity: 1; }
      48%, 100% { opacity: 0; }
    }

    /* Scene 2 Animations (6s - 12s) */
    @keyframes scene2_fade {
      0%, 47% { opacity: 0; }
      50%, 95% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }

    @keyframes s2_step_resumed {
      0%, 62% { opacity: 0; }
      66%, 95% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .anim-s1 { animation: scene1_fade 12s infinite ease-in-out; }
    .anim-s1-hud { animation: s1_step_hud 12s infinite ease-in-out; }
    .anim-s1-query { animation: s1_step_query 12s infinite ease-in-out; }
    .anim-s1-limit { animation: s1_step_limit 12s infinite ease-in-out; }

    .anim-s2 { animation: scene2_fade 12s infinite ease-in-out; }
    .anim-s2-resumed { animation: s2_step_resumed 12s infinite ease-in-out; }
    .anim-cursor { animation: blink 0.9s infinite; }
  </style>

  <!-- Terminal Window Chrome -->
  <g filter="url(#shadow)">
    <!-- Body -->
    <rect x="20" y="20" width="800" height="420" rx="10" fill="url(#bgGrad)" stroke="#262833" stroke-width="1.2"/>
    
    <!-- Titlebar -->
    <path d="M 20 30 A 10 10 0 0 1 30 20 L 810 20 A 10 10 0 0 1 820 30 L 820 54 L 20 54 Z" fill="#14161f"/>
    <line x1="20" y1="54" x2="820" y2="54" stroke="#262833" stroke-width="1"/>
    
    <!-- Traffic lights -->
    <circle cx="42" cy="37" r="5" fill="#ef4444" opacity="0.85"/>
    <circle cx="58" cy="37" r="5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="74" cy="37" r="5" fill="#10b981" opacity="0.85"/>

    <!-- Window Title -->
    <text x="420" y="41" text-anchor="middle" class="mono f-12 bold c-dim">claude-pool — automatic session failover</text>
  </g>

  <!-- ==================== SCENE 1: Launch & Cap Encounter ==================== -->
  <g class="mono anim-s1">
    
    <!-- Terminal Prompt Line -->
    <g transform="translate(50, 88)">
      <text x="0" y="0" class="c-mint bold">developer@workstation</text>
      <text x="175" y="0" class="c-dim">:</text>
      <text x="185" y="0" class="c-cyan">~/projects/api</text>
      <text x="305" y="0" class="c-dim">$</text>
      <text x="320" y="0" class="c-zinc bold">claude-pool</text>
    </g>

    <!-- Launch HUD Card -->
    <g class="anim-s1-hud" transform="translate(50, 110)">
      <rect x="0" y="0" width="740" height="96" rx="8" fill="#12141c" stroke="#2a2d3d" stroke-width="1"/>
      <path d="M 0 8 A 8 8 0 0 1 8 0 L 115 0 L 115 22 L 0 22 Z" fill="#1b1e2b"/>
      <text x="12" y="15" class="f-11 bold c-accent">claude-pool</text>
      
      <!-- HUD Line 1 -->
      <circle cx="24" cy="42" r="4" fill="#6ee7b7"/>
      <text x="38" y="46" class="bold c-zinc">active</text>
      <text x="96" y="46" class="c-zinc">primary</text>
      <text x="156" y="46" class="c-dim">(P1)</text>
      <text x="188" y="46" class="c-dim">·</text>
      <text x="202" y="46" class="c-mint bold">97% session left</text>
      <text x="328" y="46" class="c-dim">(resets in 4h 12m)</text>

      <!-- HUD Line 2 -->
      <circle cx="24" cy="66" r="3.5" fill="none" stroke="#71717a" stroke-width="1.2"/>
      <text x="38" y="70" class="c-dim">standby</text>
      <text x="96" y="70" class="c-muted">account4 (P2), backup (P3)</text>

      <!-- HUD Line 3 -->
      <text x="21" y="89" class="f-11 c-accent">◌</text>
      <text x="38" y="90" class="c-dim">pool</text>
      <text x="96" y="90" class="c-muted">193.4M tokens today across 3 accounts</text>
    </g>

    <!-- Claude Query & Processing -->
    <g class="anim-s1-query" transform="translate(50, 238)">
      <text x="0" y="0" class="c-accent bold">&gt;</text>
      <text x="16" y="0" class="c-zinc">Refactor auth middleware to use redis token cache</text>
      <text x="0" y="24" class="c-dim">● Thinking... reading src/auth.ts and config.ts</text>
      <text x="0" y="46" class="c-mint">✓ Generated updated middleware (4 files modified)</text>
    </g>

    <!-- Anthropic Rolling Limit Alert -->
    <g class="anim-s1-limit" transform="translate(50, 318)">
      <rect x="0" y="0" width="740" height="32" rx="6" fill="#211912" stroke="#48301a" stroke-width="1"/>
      <text x="16" y="20" class="f-12 bold c-ochre">⚠️  Anthropic 5-hour rolling limit reached on primary account.</text>
    </g>

  </g>

  <!-- ==================== SCENE 2: Failover Transition & Resumed ==================== -->
  <g class="mono anim-s2">
    
    <!-- Auto-Failover Transition Card -->
    <g transform="translate(50, 84)">
      <rect x="0" y="0" width="740" height="126" rx="8" fill="#14131b" stroke="#3d2f24" stroke-width="1.2"/>
      <path d="M 0 8 A 8 8 0 0 1 8 0 L 165 0 L 165 24 L 0 24 Z" fill="#2d201a"/>
      <text x="12" y="16" class="f-11 bold c-ochre">failover transition</text>

      <!-- Details -->
      <text x="20" y="48" class="c-ochre bold">Rate limit reached on primary</text>
      
      <circle cx="24" cy="71" r="3.5" fill="#6ee7b7"/>
      <text x="36" y="75" class="c-dim">preserved session</text>
      <text x="180" y="75" class="c-zinc">4e00c501-e0c9-4b2a-874a...</text>

      <circle cx="24" cy="93" r="3.5" fill="#6ee7b7"/>
      <text x="36" y="97" class="c-dim">synchronized state</text>
      <text x="180" y="97" class="c-zinc">.jsonl transcripts mirrored to account4</text>

      <text x="20" y="117" class="c-accent bold">→</text>
      <text x="36" y="117" class="bold c-mint">continuing on</text>
      <text x="180" y="117" class="bold c-zinc">account4</text>
      <text x="250" y="117" class="c-dim">(promoted to Priority 1)</text>
    </g>

    <!-- Resumed Conversation -->
    <g class="anim-s2-resumed" transform="translate(50, 240)">
      <text x="0" y="0" class="c-dim">Resuming conversation 4e00c501-e0c9-4b2a on account4...</text>
      
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="740" height="36" rx="6" fill="#101915" stroke="#1d3b2b" stroke-width="1"/>
        <text x="16" y="22" class="c-mint bold">✓ Seamless failover complete: 100% conversation memory intact.</text>
      </g>

      <text x="0" y="96" class="c-zinc">All 14 tests passing. What would you like to build next?</text>

      <!-- Interactive Prompt -->
      <g transform="translate(0, 126)">
        <text x="0" y="0" class="c-accent bold">&gt;</text>
        <rect x="18" y="-12" width="8" height="15" fill="#a5b4fc" class="anim-cursor"/>
      </g>
    </g>

  </g>
</svg>
